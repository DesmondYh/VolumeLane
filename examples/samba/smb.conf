[global]
    server role = standalone server
    netbios name = DEVICE-FILES
    smb ports = 445
    disable netbios = yes
    server min protocol = SMB2_02
    server signing = mandatory
    map to guest = Never
    load printers = no
    disable spoolss = yes
    printcap name = /dev/null

[Shared]
    path = /shared
    valid users = sharedisk
    read only = no
    guest ok = no
    create mask = 0600
    directory mask = 0700
