<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="682" viewBox="0 0 1240 682" role="img" aria-labelledby="title description">
  <title id="title">Device Files architecture</title>
  <desc id="description">The owner uses the web dashboard through Tailscale Serve. The Docker dashboard talks to the Mac mini host agent. Authorized collaborators connect through Tailscale to the Samba service in Docker. The host agent and Samba both read and write the same shared folder on the Lenovo external drive. The dashboard can also reach authorized agents on other computers over Tailscale.</desc>

  <defs>
    <marker id="web-arrow" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="10" refY="6" orient="auto">
      <path d="m2 2 8 4-8 4" fill="none" stroke="#2764ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="smb-arrow" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="10" refY="6" orient="auto">
      <path d="m2 2 8 4-8 4" fill="none" stroke="#087c71" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #122641; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #3f5674; }
      .title { font-size: 38px; font-weight: 720; letter-spacing: -1.2px; }
      .subtitle { font-size: 18px; fill: #445979; }
      .group-title { font-size: 18px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 14px; fill: #445979; }
      .footnote { font-size: 15px; fill: #3d536f; }
      .web { fill: #2764ad; }
      .smb { fill: #087c71; }
      .web-link { fill: none; stroke: #2764ad; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#web-arrow); }
      .smb-link { fill: none; stroke: #087c71; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#smb-arrow); }
    </style>
  </defs>

  <rect x=".5" y=".5" width="1239" height="681" rx="25" fill="#f5f8fc" stroke="#d8e1ee"/>
  <g aria-hidden="true" transform="translate(48 34)">
    <rect width="28" height="28" rx="8" fill="#2860a3"/>
    <path d="M8 10h12M8 14h12M8 18h12" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="89" y="53" class="eyebrow">DEVICE FILES</text>
  <text x="48" y="109" class="title">One shared folder, two ways to work</text>
  <text x="48" y="140" class="subtitle">Manage files in the browser or mount the same folder as an SMB drive.</text>
  <path d="M48 160h1144" fill="none" stroke="#d6e0ee"/>

  <text x="48" y="195" class="eyebrow">CLIENTS</text>
  <text x="1010" y="195" class="eyebrow">STORAGE</text>

  <rect x="266" y="177" width="196" height="411" rx="19" fill="#eef3fb" stroke="#cddbef"/>
  <text x="285" y="209" class="group-title">Private Tailscale</text>
  <text x="285" y="233" class="small">Encrypted connections</text>

  <rect x="506" y="177" width="452" height="411" rx="19" fill="#eef3fb" stroke="#cddbef"/>
  <text x="525" y="209" class="group-title">Mac mini</text>
  <text x="525" y="233" class="small">Docker services and host file access</text>
  <path d="M525 381h414" fill="none" stroke="#cbd8ea" stroke-dasharray="4 6"/>

  <g aria-hidden="true">
    <path d="M224 302h58" class="web-link"/>
    <path d="M446 302h80" class="web-link"/>
    <path d="M705 302h39" class="web-link"/>
    <path d="M938 302h38q10 0 10 10v60q0 10 10 10h14" class="web-link"/>
    <path d="M224 465h58" class="smb-link"/>
    <path d="M446 465h80" class="smb-link"/>
    <path d="M938 465h38q10 0 10-10v-15q0-10 10-10h14" class="smb-link"/>
  </g>

  <g>
    <rect x="48" y="253" width="176" height="98" rx="14" fill="#fff" stroke="#c7d5e8"/>
    <path d="M64 272h21v15H64zM64 276h21" fill="none" stroke="#2764ad" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="310" class="label">Owner</text>
    <text x="64" y="333" class="small">Web browser</text>

    <rect x="48" y="416" width="176" height="98" rx="14" fill="#fff" stroke="#c7d5e8"/>
    <path d="M64 438h10l4 4h10v13H64z" fill="none" stroke="#087c71" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="474" class="label">Collaborators</text>
    <text x="64" y="497" class="small">Finder / File Explorer</text>
  </g>

  <g>
    <rect x="282" y="253" width="164" height="98" rx="14" fill="#fff" stroke="#bed3ef"/>
    <rect x="282" y="270" width="3" height="64" rx="1.5" fill="#2764ad"/>
    <text x="296" y="295" class="label">Tailscale Serve</text>
    <text x="296" y="319" class="small">Owner identity</text>

    <rect x="282" y="416" width="164" height="98" rx="14" fill="#fff" stroke="#bbdfd8"/>
    <rect x="282" y="433" width="3" height="64" rx="1.5" fill="#087c71"/>
    <text x="296" y="458" class="label">SMB transport</text>
    <text x="296" y="482" class="small">TCP 445</text>
  </g>

  <g>
    <rect x="526" y="253" width="179" height="98" rx="14" fill="#fff" stroke="#bed3ef"/>
    <text x="542" y="295" class="label">Web dashboard</text>
    <text x="542" y="319" class="small">Docker container</text>

    <rect x="744" y="253" width="194" height="98" rx="14" fill="#fff" stroke="#bed3ef"/>
    <text x="760" y="295" class="label">Host file agent</text>
    <text x="760" y="319" class="small">macOS permissions</text>

    <rect x="526" y="416" width="412" height="98" rx="14" fill="#fff" stroke="#bbdfd8"/>
    <text x="542" y="458" class="label">Samba SMB service</text>
    <text x="542" y="482" class="small">Docker container · authorized accounts</text>
  </g>

  <g>
    <rect x="1010" y="328" width="182" height="155" rx="16" fill="#e4f4ef" stroke="#a1cdc0"/>
    <path d="M1028 346h12l4 4h12v14h-28z" fill="none" stroke="#087c71" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1028" y="392" class="label">Shared folder</text>
    <text x="1028" y="416" class="small">Lenovo external drive</text>
    <text x="1028" y="448" class="small smb">Read and write</text>
  </g>

  <rect x="48" y="614" width="1144" height="38" rx="10" fill="#eaf0f8"/>
  <text x="64" y="638" class="footnote">The dashboard can also browse authorized folders on connected Mac and Windows file agents over Tailscale.</text>
</svg>
